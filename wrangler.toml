# lmatias.com on Cloudflare: one Worker that serves the built site (dist/) as static assets.
# Deploy command in the Cloudflare dashboard: npx wrangler deploy (after the build command: npm run build).
name = "lmatias"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
# Only these addresses run Worker code. Everything else is a plain file of the site (free and unlimited).
run_worker_first = ["/admin/auth", "/admin/callback"]

[vars]
OWNER_EMAIL = "luisdafmatias@gmail.com"

# Added when the CV and letter builders are built (the private database and the PDF storage).
# Create them in the Cloudflare dashboard first, then uncomment and fill in the id:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "lmatias"
# database_id = "<id from the dashboard>"
# migrations_dir = "migrations"
#
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "lmatias-files"
#
# Cloudflare Access (to check the login again inside the API):
# ACCESS_TEAM_DOMAIN = "https://<team>.cloudflareaccess.com"
# ACCESS_AUD = "<application AUD tag>"
