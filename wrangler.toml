# lmatias.com on Cloudflare: one Worker that serves the built site (dist/) as static assets.
# Deploy command in the Cloudflare dashboard: npx wrangler deploy (after the build command: npm run build).
name = "lmatias"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
# Only these addresses run Worker code. Everything else is a plain file of the site (free and unlimited).
run_worker_first = ["/admin/api/*"]

[vars]
OWNER_EMAIL = "luisdafmatias@gmail.com"
# The login lock (Cloudflare Access). Both values are shown in the Cloudflare dashboard and are not secret.
# If they are empty or wrong, the private API refuses everyone (it fails closed).
ACCESS_TEAM_DOMAIN = "https://small-meadow-974d.cloudflareaccess.com"
ACCESS_AUD = "e98f655a94d8df55985662e35bfa51e77af7e9e307018e2e2938c3d159d1fcbc"   # several tags can be listed with commas

# Where the project editor saves (every save is a commit on this branch).
GITHUB_REPO = "oLuisMatias/oLuisMatias.github.io"
GITHUB_BRANCH = "main"

# Secret (set in the Cloudflare dashboard, never in this file): GITHUB_TOKEN

# Added when the CV and letter builders are built (the private database and the PDF storage).
# Create them in the Cloudflare dashboard first, then uncomment and fill in the id:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "lmatias"
# database_id = "<id from the dashboard>"
# migrations_dir = "migrations"
#
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "lmatias-files"
