  <!-- YouTube modal -->
  <div class="yt-modal" id="ytModal" hidden>
    <div class="yt-modal__backdrop" onclick="closeYoutubeModal()"></div>
    <div class="yt-modal__box">
      <button class="yt-modal__close" onclick="closeYoutubeModal()">✕</button>
      <iframe id="ytFrame" src="" frameborder="0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </div>
  </div>

  <script>
    function openYoutubeModal(url) {
      const modal = document.getElementById('ytModal');
      const frame = document.getElementById('ytFrame');
      // Convert youtube URL to embed URL
      let embedUrl = url;
      if (url.includes('youtube.com/watch')) {
        const videoId = new URL(url).searchParams.get('v');
        embedUrl = `https://www.youtube.com/embed/${videoId}`;
      } else if (url.includes('youtu.be/')) {
        const videoId = url.split('youtu.be/')[1].split('?')[0];
        embedUrl = `https://www.youtube.com/embed/${videoId}`;
      }
      frame.src = embedUrl;
      modal.removeAttribute('hidden');
    }
    function closeYoutubeModal() {
      const modal = document.getElementById('ytModal');
      const frame = document.getElementById('ytFrame');
      frame.src = '';
      modal.setAttribute('hidden', '');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeYoutubeModal(); });
  </script>

  <!-- Image fullscreen modal -->
  <div class="project-img-modal" id="projectImgModal" hidden>
    <div class="project-img-modal__backdrop" onclick="closeProjectImage()"></div>
    <div class="project-img-modal__box">

  <script>
    function openProjectImage(src) {
      const modal = document.getElementById('projectImgModal');
      const img = document.getElementById('projectImgModalImg');
      img.src = src;
      modal.removeAttribute('hidden');
    }
    function closeProjectImage() {
      const modal = document.getElementById('projectImgModal');
      const img = document.getElementById('projectImgModalImg');
      img.src = '';
      modal.setAttribute('hidden', '');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeProjectImage(); });
  </script>

  <!-- 3D viewer modal (Google Model Viewer) -->
  <div class="model-modal" id="modelModal" hidden>
    <div class="model-modal__backdrop" id="modelBackdrop"></div>
    <div class="model-modal__box">
      <button class="model-modal__close" id="modelClose">✕</button>
      <model-viewer
        id="modelViewer"
        alt="3D Model"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        shadow-intensity="1"
        environment-image="neutral"
        style="width:100%;flex:1;min-height:0;background:#1a1a1a;border-radius:8px;"
      ></model-viewer>
    </div>
  </div>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <script>
    (function() {
      const modal = document.getElementById('modelModal');
      const viewer = document.getElementById('modelViewer');
      const backdrop = document.getElementById('modelBackdrop');
      const closeBtn = document.getElementById('modelClose');

      window.openModel = function(src, title) {
        modal.removeAttribute('hidden');
        // Prepend data/models/ if no folder path is specified
        let modelSrc = src;
        if (!modelSrc.includes('/')) {
          modelSrc = 'data/models/' + modelSrc;
        }
        const encodedSrc = modelSrc.split('/').map(part => encodeURIComponent(part)).join('/');
        requestAnimationFrame(() => {
          viewer.setAttribute('src', encodedSrc);
          viewer.setAttribute('alt', title || '3D Model');
        });
      };

      function closeModel() {
        modal.setAttribute('hidden', '');
        viewer.removeAttribute('src');
      }

      closeBtn.addEventListener('click', closeModel);
      backdrop.addEventListener('click', closeModel);
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !modal.hasAttribute('hidden')) closeModel();
      });

      // ── Interaction hint for all model-viewers ──────
      function addInteractionHint(mv) {
        const hint = document.createElement('div');
        hint.className = 'model-hint';
        hint.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 13"/>
          </svg>
          <span>Drag to rotate</span>
        `;
        mv.parentElement.style.position = 'relative';
        mv.parentElement.appendChild(hint);

        function removeHint() {
          hint.classList.add('model-hint--hidden');
          setTimeout(() => hint.remove(), 300);
          mv.removeEventListener('camera-change', removeHint);
        }
        mv.addEventListener('camera-change', removeHint);
      }

      // Observe for dynamically added model-viewers (inline banner)
      const observer = new MutationObserver((mutations) => {
        mutations.forEach(m => {
          m.addedNodes.forEach(node => {
            if (node.nodeType !== 1) return;
            const viewers = node.tagName === 'MODEL-VIEWER' ? [node] : node.querySelectorAll ? node.querySelectorAll('model-viewer') : [];
            viewers.forEach(mv => {
              if (mv.id === 'modelViewer') return; // modal viewer handled separately
              mv.addEventListener('load', () => addInteractionHint(mv), { once: true });
            });
          });
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Hint for modal viewer
      viewer.addEventListener('load', () => addInteractionHint(viewer));
    })();
  </script>
