          text: |-
            I wanted to challenge myself by building a CNC machine from scratch, while also making something useful for my workshop, so I decided to create my own laser engraver.

            With the powerful 22W Sculpfun S30 Ultra laser module attached, this machine can easily engrave and cut materials like wood, plywood, acrylic, leather, and even engrave on metal.

            Mechanically, it is a Cartesian CNC system. I used custom 3D printed parts for the assembly to keep the project within a reasonable budget.
        - type: facts
    - type: media
sections:
  - type: text
    text: |-
      **Engineering Challenges & Solved Problems**

       - __Rigidity vs. Cost:__ The primary engineering challenge was ensuring the 3D-printed plates could handle the mechanical stress and vibration of the stepper motors. This was solved by optimizing print settings (high infill density and perimeter walls) and utilizing the inherent stiffness of the V-slot aluminum to bear the primary structural loads.

      - __Gantry Alignment:__ Implementing a dual-motor Y-axis required precise mechanical alignment and electronic syncing to ensure both sides of the gantry move perfectly in tandem without binding.
  - split: columns
    sizes:
      - 54.73
      - 45.27
    children:
      - type: text
        text: |-
          **Frame & Linear Motion:**

          - __V-Slot Aluminum Profiles:__ Utilized for the main structural frame, providing a heavy-duty, smooth track for the motion carriage.

          - __V-Wheels:__ Delrin V-wheels ride directly inside the profile slots, ensuring smooth, low-friction linear travel and minimal play.

          - __3D Printed Components:__ All structural joining plates, motor mounts, and wheel brackets were custom-designed and 3D printed. This drastically reduced the build budget while allowing for rapid iterative prototyping.
