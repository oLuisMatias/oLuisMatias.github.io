        text: |-
          **Kinematics & Drive System (4-Motor Setup)**

          - __X-Axis:__ Driven by 1 stepper motor for fast lateral travel.
          - __Y-Axis:__ Driven by 2 dual-synced stepper motors to prevent gantry racking (twisting) and ensure perfectly square movement over the engraving area.
          - __Z-Axis:__ Driven by 1 stepper motor, giving the machine true 3D spatial movement.
