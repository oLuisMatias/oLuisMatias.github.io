            text: |-
              **Focus Optimization (Z-Axis Integration)**

              - Unlike traditional manual-focus laser setups, this build features a semi-automatic Z-axis. This allows for precise, software-controlled laser focus height adjustments instead of manual tuning. In the future, I plan to add a sensor to the machine to enable fully automatic focus adjustment based on the material thickness.
          - type: text
            text: |-
              **Software & Control**

              - For the software and control layout, I am using the MKS DLC32 Max mainboard. I use LightBurn to design my projects, generate the necessary G-code, and run the machine directly.
