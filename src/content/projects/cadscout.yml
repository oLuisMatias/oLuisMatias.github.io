      - type: text
        text: |-
          **What it does**

          - **Look around:** orbit, pan and zoom with CAD-style mouse controls, fit and isometric views, perspective on or off, edges on or off, light and dark theme.
          - **Fast:** STEP files are repaired on all processor cores, and models that took a while to load are cached, so opening them again is almost instant.
          - **Parts:** click a part to see its name and size; right-click to hide it, show only it or make it transparent.
          - **Follows your work:** the file reloads by itself when it is saved again, keeping the camera and the hidden or transparent parts.
          - **3D printing projects:** for 3MF files, including Bambu Studio and Orca Slicer projects, a side panel shows the printer, profile, filaments, plates, objects and the slicing result.
          - **Everywhere in Windows:** right-click a model in Explorer and choose "View with CADscout". Available in English, Portuguese, German, Spanish and Slovak.
