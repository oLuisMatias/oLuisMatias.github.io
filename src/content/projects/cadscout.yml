          text: |-
            I often need to check a model that someone sent me, or one of my own exports, and opening a full CAD program for a quick look is slow. So I built CADscout: a small, fast viewer that opens CAD and 3D print files and shows what is inside.

            It is free and open source, and CADscout Lite is available in the Microsoft Store.
        - type: facts
    - type: media
