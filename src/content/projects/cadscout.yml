        text: |-
          **What it opens**

          STEP, IGES, BREP, STL, OBJ, PLY, VRML, glTF, 3MF and DXF, and these files inside a ZIP archive without unpacking it first. SolidWorks files use a closed format, so they need to be exported to STEP first.

          **How it is built**

          Two editions come from the same code: **CADscout Lite**, a small window for a quick look (released), and **CADscout Full**, which is under development. It is written in C++ with Qt 6 for the interface and Open CASCADE for reading and repairing CAD geometry, and packaged for the Microsoft Store as an MSIX.
