about:
  eyebrow: About
  title: Why I build things
  text: |-
    I am a Mechanical Design Engineer originally from Portugal, but currently living and working in Slovakia.

    I studied Mechanical Engineering because I love figuring out how things work. Even outside of my daily job, in my free time, I love working on my own machine design projects and experimenting with 3D printing. I really enjoy taking a personal idea, designing it on the computer, and printing a real, working prototype at home.

    Thanks for visiting my website! Feel free to look around or contact me if you want to talk about engineering and 3D printing.
cta:
  title: Let's talk engineering and 3D printing.
  text: Open to opportunities in mechanical design, collaborations or just a chat.
